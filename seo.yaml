      breadcrumb: auto
      faq:
      - q: What is reserve-based lending (RBL) in oil and gas financing?
        a: Reserve-based lending is a core financing structure where borrowing capacity is determined by the value of proven oil and gas reserves. The borrowing base is periodically reassessed based on reserve reports, production performance, and commodity pricing.
      - q: How does financing support upstream oil and gas operations?
        a: Financing supports upstream activities such as drilling, field development, and production scaling. Structures are aligned with reserve quality, production output, and capital expenditure requirements to ensure operational continuity.
      - q: Can oil and gas companies leverage receivables for financing?
        a: Yes, companies can utilize accounts receivable (AR) financing to convert invoices from offtake agreements and counterparties into immediate liquidity. This improves cash flow timing and supports ongoing operational expenses.
      - q: How are borrowing bases determined in oil and gas financing?
        a: Borrowing bases are typically calculated using a combination of reserve valuations, production forecasts, receivables quality, and commodity price assumptions. These are reviewed periodically to reflect current market and operational conditions.
      - q: Is financing available for midstream oil and gas infrastructure?
        a: Yes, financing can be structured for pipelines, storage facilities, and processing assets. These facilities are generally supported by long-term contracts, throughput agreements, and stable, fee-based revenue streams.
