  /financial-services/accounts-receivable-financing:
    title: "Accounts Receivable Financing for the Middle Market | EPOCH"
    description: "Accounts receivable financing for middle-market companies. EPOCH structures facilities of $5M-$100M+ with 85-90% advance rates and funding in 24-48 hours."
    keywords: accounts receivable financing company, accounts receivable finance, financing accounts receivable, ar finance, ar financing, ar lending, accounts receivable financing, loan against accounts receivable, accounts receivable lending, accounts receivable loans, accounts receivables financing, accounts receivable funding, ar funding, account financing receivables, accounts receivable line of credit financing
    canonical: /financial-services/accounts-receivable-financing
    schema:
      breadcrumb: auto
      faq:
        - q: "How fast can we fund?"
          a: "Once a facility is in place, individual draws typically fund within 24-48 hours of submitting an updated borrowing base certificate. Establishing the facility itself — underwriting the receivables portfolio, negotiating eligibility terms, and documenting the agreement — generally takes two to four weeks. EPOCH manages that process with the lender so the timeline is driven by diligence, not by shopping the deal."
        - q: "Who qualifies for accounts receivable financing?"
          a: "B2B companies that invoice creditworthy commercial or government customers on net-30 to net-90 terms. Lenders underwrite the receivables portfolio more than the borrower's own credit profile, which is why AR financing works for companies carrying leverage, absorbing PE-sponsored growth, or recovering from a difficult year. A receivables pool of at least $1-2 million, reasonable customer concentration, and clean invoicing practices are the practical thresholds."
        - q: "Is accounts receivable financing debt?"
          a: "Yes. Unlike factoring, which is a sale of the receivables, AR financing is a loan secured by receivables you continue to own — it appears on the balance sheet as debt. For CFOs and sponsors, that is usually acceptable: it is short-term, self-liquidating debt that rises and falls with revenue, and it preserves customer relationships because collections stay in-house and the facility remains confidential."
        - q: "How are fees calculated?"
          a: "Fees run 0.75-1.50% per month on the outstanding drawn balance, not on the full commitment. A company drawing an average of $3 million against a $10 million facility at 1.00% pays roughly $30,000 per month — about $360,000 annually. Most facilities add a modest unused-line fee and closing costs. Because collections pay the line down daily, disciplined borrowers keep effective costs well below the headline rate."
        - q: "What is the difference between AR financing and factoring?"
          a: "AR financing is a loan; factoring is a sale. With AR financing you retain ownership of the invoices, collect from customers under your own name, and your customers typically never know a facility exists. With factoring, the factor buys the invoices, notifies your customers, and collects directly — at a materially higher cost, often 1-4% of face value per 30 days. Middle-market companies with quality receivables rarely need to factor."
        - q: "What is the minimum facility size?"
          a: "Institutional AR financing generally starts around $5 million and scales past $100 million, with the most efficient pricing typically emerging above $10 million in committed size. Because availability is driven by eligible receivables, the practical floor is the AR portfolio itself: a company needs a receivables base large and diverse enough to support a borrowing base the lender can monitor economically. EPOCH structures facilities across this full range."
        - q: "What types of receivables qualify for financing?"
          a: "Eligible receivables generally include invoices issued to creditworthy commercial or institutional customers with verifiable payment obligations. Qualification depends on obligor strength, payment history, invoice aging, and overall portfolio diversification."
        - q: "How does receivable financing differ from traditional bank lending?"
          a: "Receivable financing focuses primarily on collateral quality rather than enterprise valuation or cash flow alone. This allows companies to access larger and more flexible credit facilities, particularly when traditional bank capacity becomes constrained due to growth, acquisitions, or structural complexity."
